services:
  db:
    image: postgres:16-alpine
    container_name: matricula-db
    environment:
      POSTGRES_USER: matricula
      POSTGRES_PASSWORD: matricula
      POSTGRES_DB: matricula
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matricula -d matricula"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
